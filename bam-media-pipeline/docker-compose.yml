services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./sql/init_schema.sql:/docker-entrypoint-initdb.d/init_schema.sql

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data

  api-server:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    ports:
      - "127.0.0.1:${API_PORT:-3080}:3080"
    environment:
      - PIPELINE_OPERATOR_TOKEN=${PIPELINE_OPERATOR_TOKEN:?Set PIPELINE_OPERATOR_TOKEN}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3080,http://127.0.0.1:3080}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - OLLAMA_URL=${OLLAMA_URL:-http://host.docker.internal:11434}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT:-}
      - AZURE_OPENAI_API_KEY=${AZURE_OPENAI_API_KEY:-}
      - AZURE_OPENAI_DEPLOYMENT=${AZURE_OPENAI_DEPLOYMENT:-gpt-4o}
      - AZURE_OPENAI_API_VERSION=${AZURE_OPENAI_API_VERSION:-2024-08-01-preview}
      - BAM_VISION_BACKEND=${BAM_VISION_BACKEND:-ollama}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-}
      - OLLAMA_VISION_MODEL=${OLLAMA_VISION_MODEL:-gemma3:4b}
      - OLLAMA_JUDGE_MODEL=${OLLAMA_JUDGE_MODEL:-gemma3:4b}
      - OPENROUTER_MAX_REQUESTS_PER_DAY=${OPENROUTER_MAX_REQUESTS_PER_DAY:-10}
      - OPENROUTER_MIN_INTERVAL_SECONDS=${OPENROUTER_MIN_INTERVAL_SECONDS:-6}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - BAM_VISION_MAX_EDGE=${BAM_VISION_MAX_EDGE:-1600}
      - BAM_VISION_LIMIT=${BAM_VISION_LIMIT:-180}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./server:/app/server
      - ./scripts:/app/scripts
      - ./static:/app/static
      - ${ONEDRIVE_SOURCE_PATH}:/storage/onedrive_mount:ro
      - ${PIPELINE_STORAGE_PATH}/active:/storage/active
      - ${PIPELINE_STORAGE_PATH}/originals:/storage/originals:ro
      - ${PIPELINE_STORAGE_PATH}/exports:/storage/exports
    command: uvicorn server.app:app --host 0.0.0.0 --port 3080 --reload

  derivative-worker:
    profiles: [derivatives]
    build:
      context: ./scripts
      dockerfile: Dockerfile
    restart: "no"
    depends_on:
      - postgres
      - redis
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
    volumes:
      - ./scripts:/app/scripts
      - ${PIPELINE_STORAGE_PATH}/active:/storage/active:ro
      - ${PIPELINE_STORAGE_PATH}/exports:/storage/exports
    command: node /app/scripts/derivative_builder.js

volumes:
  pg_data:
  redis_data:

