services:
  postgres:
    image: postgres:16-alpine
    container_name: bam-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./sql/init_schema.sql:/docker-entrypoint-initdb.d/init_schema.sql

  redis:
    image: redis:7-alpine
    container_name: bam-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  api-server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: bam-api-server
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    ports:
      - "3080:3080"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - OLLAMA_URL=
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT}
      - AZURE_OPENAI_API_KEY=${AZURE_OPENAI_API_KEY}
      - AZURE_OPENAI_DEPLOYMENT=${AZURE_OPENAI_DEPLOYMENT:-gpt-4o}
      - AZURE_OPENAI_API_VERSION=${AZURE_OPENAI_API_VERSION:-2024-08-01-preview}
      - BAM_VISION_BACKEND=azure
      - BAM_VISION_MAX_EDGE=${BAM_VISION_MAX_EDGE:-1600}
      - BAM_VISION_LIMIT=${BAM_VISION_LIMIT:-180}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./server:/app/server
      - ./scripts:/app/scripts
      - ./static:/app/static
      - ${ONEDRIVE_SOURCE_PATH}:/storage/onedrive_mount:ro
      - ${PIPELINE_STORAGE_PATH}/active:/storage/active
      - ${PIPELINE_STORAGE_PATH}/originals:/storage/originals
      - ${PIPELINE_STORAGE_PATH}/exports:/storage/exports
    command: uvicorn server.app:app --host 0.0.0.0 --port 3080 --reload

  derivative-worker:
    build:
      context: ./scripts
      dockerfile: Dockerfile
    container_name: bam-derivative-worker
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
    volumes:
      - ./scripts:/app/scripts
      - ${PIPELINE_STORAGE_PATH}/active:/storage/active:ro
      - ${PIPELINE_STORAGE_PATH}/exports:/storage/exports
    command: node /app/scripts/derivative_builder.js

volumes:
  pg_data:
  redis_data:
