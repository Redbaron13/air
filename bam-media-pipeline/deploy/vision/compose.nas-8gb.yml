# Observed BAMNAS: 7.50 GB usable RAM, Volume 1 ext4.
# Bootstrap only. Full review worker not yet deployed/benchmarked.
services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports: ["127.0.0.1:11435:11434"]
    environment:
      OLLAMA_HOST: "0.0.0.0:11434"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_CONTEXT_LENGTH: "4096"
      OLLAMA_KEEP_ALIVE: "0"
    volumes:
      - /volume1/docker/bam-local-review/models:/root/.ollama
    mem_limit: 5g
    cpus: 2
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
