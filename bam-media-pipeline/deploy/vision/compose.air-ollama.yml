# Apply AFTER AIR's NAS compose and compose.ollama.yml in a single Compose project.
services:
  api-server:
    environment:
      OLLAMA_URL: http://ollama:11434
      OLLAMA_VISION_MODEL: gemma3:4b
      OLLAMA_JUDGE_MODEL: gemma3:4b
      BAM_VISION_BACKEND: ollama
    depends_on:
      ollama:
        condition: service_healthy
