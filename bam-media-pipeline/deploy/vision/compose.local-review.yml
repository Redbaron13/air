name: bam-local-review
services:
  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    restart: unless-stopped
    ports: ["127.0.0.1:11435:11434"]
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_CONTEXT_LENGTH: "8192"
      OLLAMA_KEEP_ALIVE: "0"
    volumes:
      - ${BAM_EXT4_ROOT:?Set BAM_EXT4_ROOT}/models:/root/.ollama
    mem_limit: ${OLLAMA_MEMORY_LIMIT:-12g}
    cpus: ${OLLAMA_CPU_LIMIT:-4}
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    healthcheck:
      test: [CMD, ollama, list]
      interval: 20s
      timeout: 10s
      retries: 5
  review:
    profiles: [worker]
    build:
      context: ../..
      dockerfile: deploy/vision/Dockerfile.local-review
    depends_on:
      ollama: {condition: service_healthy}
    user: "${BAM_UID:-1000}:${BAM_GID:-1000}"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp:size=256m]
    mem_limit: 2g
    cpus: 2
    environment:
      OLLAMA_URL: http://ollama:11434
      LOCAL_INFORMED_MODEL: ${LOCAL_INFORMED_MODEL:-gemma3:4b}
      LOCAL_BLIND_MODEL: ${LOCAL_BLIND_MODEL:-qwen2.5vl:3b}
      LOCAL_MERGER_MODEL: ${LOCAL_MERGER_MODEL:-qwen3:4b}
      LOCAL_ARBITER_MODEL: ${LOCAL_ARBITER_MODEL:-llama3.2-vision:11b}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-nvidia/nemotron-3.5-super-vl:free}
      OPENROUTER_API_KEY_FILE: /state/secrets/openrouter.key
      OPENROUTER_BUDGET_PATH: /state/openrouter-budget.sqlite3
      OPENROUTER_MAX_REQUESTS_PER_DAY: "10"
      OPENROUTER_MIN_INTERVAL_SECONDS: "6"
    volumes:
      - ${BAM_EXT4_ROOT:?Set BAM_EXT4_ROOT}/inbox:/input:ro
      - ${BAM_EXT4_ROOT:?Set BAM_EXT4_ROOT}/state:/state
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
