# CPU-compatible baseline. No public/LAN listener or access to media directories.
name: bam-vision
services:
  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_KEEP_ALIVE: 5m
      OLLAMA_CONTEXT_LENGTH: "4096"
    volumes:
      - models:/root/.ollama
    mem_limit: ${OLLAMA_MEMORY_LIMIT:-6g}
    cpus: ${OLLAMA_CPU_LIMIT:-2}
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    healthcheck:
      test: [CMD, ollama, list]
      interval: 30s
      timeout: 10s
      retries: 3
volumes:
  models:
